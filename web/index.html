<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DEGLOOR ONE">

  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="favicon.png" />

  <title> DEGLOOR ONE </title>
  <meta name="description" content="Everything Local. One App." />

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0D2B5C">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0A1B3D">

  <link rel="manifest" href="manifest.json">
  
  <script>
    window.__degloorGoogleMapsReady = function () {
      try {
        return typeof google !== 'undefined' && !!google.maps && !!google.maps.MapTypeId;
      } catch (e) {
        return false;
      }
    };
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8F9FB;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      flex-direction: column;
      font-family: 'Inter', sans-serif;
    }
    .loading img {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div id="loading_indicator" class="loading">
    <img src="icons/Icon-192.png" alt="DEGLOOR ONE" />
    <div style="color: #0D2B5C; font-weight: bold;">Loading...</div>
  </div>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
