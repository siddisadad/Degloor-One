services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: degloor_one
      POSTGRES_USER: degloor
      POSTGRES_PASSWORD: degloor
    ports:
      - "5432:5432"
    volumes:
      - degloor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U degloor -d degloor_one"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/degloor_one
      DB_USERNAME: degloor
      DB_PASSWORD: degloor
      JWT_SECRET: local-dev-only-change-me-use-a-64-char-secret
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"

volumes:
  degloor_pg:
