spring:
  datasource:
    url: jdbc:h2:mem:degloor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

degloor:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-test-secret-32
    access-minutes: 30
    refresh-days: 14
