name: Backend

on:
  push:
    paths:
      - "degloor-one-backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "degloor-one-backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: degloor-one-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and integration tests
        run: mvn -B test
      - name: Static analysis
        run: mvn -B -DskipTests compile
      - name: Package
        run: mvn -B -DskipTests package
      - name: Docker image
        run: docker build -t degloor-one-backend:ci .
